<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Game modes overview">
  <rect width="520" height="140" rx="16" fill="#1a2744"/>
  <text x="260" y="26" text-anchor="middle" fill="#f0c96a" font-family="Nunito, sans-serif" font-size="16" font-weight="700">Five game modes</text>
  <g font-family="Nunito, sans-serif" font-size="11" fill="#fff">
    <rect x="16" y="42" width="88" height="78" rx="8" fill="#2d3f66"/>
    <text x="60" y="62" text-anchor="middle" font-weight="700">English 1</text>
    <text x="60" y="80" text-anchor="middle" fill="#a8b8d0">icon ” word</text>
    <rect x="112" y="42" width="88" height="78" rx="8" fill="#2d3f66"/>
    <text x="156" y="62" text-anchor="middle" font-weight="700">English 2</text>
    <text x="156" y="80" text-anchor="middle" fill="#a8b8d0">Hebrew ” English</text>
    <rect x="208" y="42" width="88" height="78" rx="8" fill="#2d3f66"/>
    <text x="252" y="62" text-anchor="middle" font-weight="700">Sums</text>
    <text x="252" y="80" text-anchor="middle" fill="#a8b8d0">+ and </text>
    <rect x="304" y="42" width="88" height="78" rx="8" fill="#2d3f66"/>
    <text x="348" y="62" text-anchor="middle" font-weight="700">Math</text>
    <text x="348" y="80" text-anchor="middle" fill="#a8b8d0">multiplication</text>
    <rect x="400" y="42" width="104" height="78" rx="8" fill="#2d3f66"/>
    <text x="452" y="62" text-anchor="middle" font-weight="700">Fractions</text>
    <text x="452" y="80" text-anchor="middle" fill="#a8b8d0">pie ” fraction</text>
  </g>
  <text x="260" y="128" text-anchor="middle" fill="#a8b8d0" font-size="11">All modes available solo and online (with a friend)</text>
</svg>
