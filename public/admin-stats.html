<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory games — Admin stats</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: light dark;
        --text: #1a2850;
        --muted: #5a6a96;
        --bg: #f3f6ff;
        --card: #fff;
        --border: #d8e2ff;
        --accent: #6c4dff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f3f6ff;
          --muted: #aeb9e6;
          --bg: #161f47;
          --card: #1e2a5a;
          --border: #354da8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        padding: 1.5rem 1rem 2.5rem;
      }
      main { max-width: 56rem; margin: 0 auto; }
      h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
      .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
      }
      .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; }
      label { display: grid; gap: 0.35rem; font-size: 0.9rem; }
      input, button {
        font: inherit;
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      button {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: 0.75rem;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.9rem 1rem;
      }
      .stat strong { display: block; font-size: 1.6rem; }
      .stat span { color: var(--muted); font-size: 0.85rem; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th, td {
        text-align: left;
        padding: 0.45rem 0.5rem;
        border-bottom: 1px solid var(--border);
      }
      .error { color: #c0392b; }
      .bar-row { display: grid; grid-template-columns: 6rem 1fr 2.5rem; gap: 0.5rem; align-items: center; margin: 0.35rem 0; }
      .bar {
        height: 0.65rem;
        border-radius: 999px;
        background: linear-gradient(90deg, #6c4dff, #ff9f1c);
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Memory games — Admin stats</h1>
      <p class="meta">Aggregated player metrics only. Not linked from the kids' app.</p>

      <section class="panel" id="loginPanel">
        <div class="row">
          <label>
            Supabase project URL
            <input id="supabaseUrl" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off" />
          </label>
          <label>
            Admin secret
            <input id="adminSecret" type="password" autocomplete="off" />
          </label>
          <button type="button" id="loadBtn">Load stats</button>
        </div>
        <p id="loginError" class="error hidden"></p>
        <p class="meta">Set <code>ADMIN_STATS_SECRET</code> on the <code>admin-stats</code> Edge Function. URL and secret are stored in this browser only.</p>
      </section>

      <section id="results" class="hidden">
        <div class="stats-grid" id="summaryCards"></div>

        <div class="panel">
          <h2>New players (last 30 days)</h2>
          <div id="newPlayersChart"></div>
        </div>

        <div class="panel">
          <h2>Age distribution</h2>
          <div id="ageChart"></div>
        </div>

        <div class="panel">
          <h2>Adventure level distribution</h2>
          <div id="levelChart"></div>
        </div>

        <p class="meta" id="generatedAt"></p>
      </section>
    </main>

    <script>
      const URL_KEY = "mm-admin-stats-url";
      const SECRET_KEY = "mm-admin-stats-secret";

      const supabaseUrlInput = document.getElementById("supabaseUrl");
      const adminSecretInput = document.getElementById("adminSecret");
      const loadBtn = document.getElementById("loadBtn");
      const loginError = document.getElementById("loginError");
      const results = document.getElementById("results");
      const summaryCards = document.getElementById("summaryCards");
      const newPlayersChart = document.getElementById("newPlayersChart");
      const ageChart = document.getElementById("ageChart");
      const levelChart = document.getElementById("levelChart");
      const generatedAt = document.getElementById("generatedAt");

      supabaseUrlInput.value = localStorage.getItem(URL_KEY) || "";
      adminSecretInput.value = localStorage.getItem(SECRET_KEY) || "";

      loadBtn.addEventListener("click", () => void loadStats());

      async function loadStats() {
        loginError.classList.add("hidden");
        loginError.textContent = "";
        const base = supabaseUrlInput.value.trim().replace(/\/$/, "");
        const secret = adminSecretInput.value.trim();
        if (!base || !secret) {
          showError("Enter the Supabase URL and admin secret.");
          return;
        }
        localStorage.setItem(URL_KEY, base);
        localStorage.setItem(SECRET_KEY, secret);
        loadBtn.disabled = true;
        try {
          const res = await fetch(`${base}/functions/v1/admin-stats`, {
            headers: { Authorization: `Bearer ${secret}` },
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showError(data.error || `Request failed (${res.status})`);
            return;
          }
          renderStats(data);
          results.classList.remove("hidden");
        } catch (e) {
          showError(e instanceof Error ? e.message : String(e));
        } finally {
          loadBtn.disabled = false;
        }
      }

      function showError(msg) {
        loginError.textContent = msg;
        loginError.classList.remove("hidden");
      }

      function renderStats(data) {
        summaryCards.replaceChildren();
        addCard("Total players", data.totalPlayers ?? 0);
        addCard("Active (7 days)", data.activePlayers7d ?? 0);

        renderBars(newPlayersChart, (data.newPlayersByDay || []).map((d) => ({
          label: d.day,
          value: d.count,
        })));

        const ageLabels = {
          "5_6": "5–6",
          "7_8": "7–8",
          "9_10": "9–10",
          "10_11": "10–11",
          "12_plus": "12+",
          unknown: "Unknown",
        };
        const age = data.ageDistribution || {};
        renderBars(
          ageChart,
          Object.keys(ageLabels).map((k) => ({ label: ageLabels[k], value: age[k] || 0 })),
        );

        const levels = data.levelDistribution || {};
        const levelRows = Object.keys(levels)
          .map((k) => ({ label: `Level ${k}`, value: levels[k] }))
          .sort((a, b) => Number(a.label.replace(/\D/g, "")) - Number(b.label.replace(/\D/g, "")));
        renderBars(levelChart, levelRows);

        generatedAt.textContent = data.generatedAt
          ? `Generated ${new Date(data.generatedAt).toLocaleString()}`
          : "";
      }

      function addCard(label, value) {
        const el = document.createElement("div");
        el.className = "stat";
        el.innerHTML = `<strong>${value}</strong><span>${label}</span>`;
        summaryCards.append(el);
      }

      function renderBars(mount, rows) {
        mount.replaceChildren();
        const max = Math.max(1, ...rows.map((r) => r.value));
        for (const row of rows) {
          const wrap = document.createElement("div");
          wrap.className = "bar-row";
          const pct = Math.round((row.value / max) * 100);
          wrap.innerHTML = `
            <span>${row.label}</span>
            <div class="bar" style="width:${pct}%"></div>
            <span>${row.value}</span>
          `;
          mount.append(wrap);
        }
      }
    </script>
  </body>
</html>
